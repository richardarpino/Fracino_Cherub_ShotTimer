[platformio]
default_envs = lilygo-t-display

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display]
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
platform = espressif32
board = lilygo-t-display
test_framework = unity
test_filter = 
    test_virtual
    test_startup_logic
    test_wifi
    test_dispatcher
    test_scale_logic
    test_hardware
    test_themes
    test_buttons
framework = arduino
upload_protocol = espota
upload_port = Cherub-Timer.local
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	lvgl/lvgl@^8.3.11
	Logic
	Services
	Sensors
	Hardware
	Interfaces
	Factories
build_unflags = -std=gnu++11 -std=c++11
build_flags = 
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=135
	-D TFT_HEIGHT=240
	-D CGRAM_OFFSET=1
	-D TFT_MOSI=19
	-D TFT_SCLK=18
	-D TFT_CS=5
	-D TFT_DC=16
	-D TFT_RST=23
	-D TFT_BL=4
	-D TFT_BACKLIGHT_ON=HIGH
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D SMOOTH_FONT=1
	-D TOUCH_CS=-1
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_CONF_SUPPRESS_DEFINE_CHECK
	-I src
	-D OTA_HOSTNAME=\"Cherub-Timer\"
	-std=gnu++17
	-D VERBOSE_BOOT=1

[env:native]
platform = native
lib_compat_mode = off
test_build_src = no
test_filter = 
    test_virtual
    test_startup_logic
    test_wifi
    test_dispatcher
    test_scale_logic
    test_digital_sensor
    test_themes
    test_warming_up
    test_buttons
    test_calibration
    test_filtering
    test_reproduction
    test_sensor_jitter
    test_shot_monitor
    test_registry_switch
    test_triggers
    test_units
    test_registry_integrity
    test_workflows
lib_ignore = 
	TFT_eSPI
	lvgl
	UI
	ShotDisplay
	Themes
build_flags = 
	-std=gnu++17
